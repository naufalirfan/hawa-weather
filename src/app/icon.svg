<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#070A14"/>
      <stop offset="100%" stop-color="#141E33"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="68%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070A14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FDE047" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="5"/>
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#orbGlow)"/>
  <g filter="url(#shadow)">
    <!-- Left column -->
    <rect x="156" y="134" width="56" height="244" rx="16" fill="url(#hGrad)"/>
    <!-- Right column -->
    <rect x="300" y="134" width="56" height="244" rx="16" fill="url(#hGrad)"/>
    <!-- Crossbar -->
    <rect x="196" y="228" width="120" height="56" rx="12" fill="url(#hGrad)"/>
  </g>
  <!-- Atmospheric Sun orb -->
  <circle cx="372" cy="126" r="22" fill="#FEF08A" filter="url(#sunGlow)"/>
</svg>